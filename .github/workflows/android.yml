# Android 构建工作流：手动触发（workflow_dispatch）产出 APK 工件，
# 推送 v* 标签时自动构建并把 APK 发布到 GitHub Release。
#
# 产物为 arm64 发布版 APK（覆盖 99%+ 的真机）。默认用 debug 密钥签名
# （可直接安装测试，不能上架 Play）；在仓库 Secrets 配置以下变量后
# 自动改用正式签名：
#   ANDROID_KEYSTORE_BASE64   # keystore 文件（base64 编码）
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
name: Android

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      # `secrets` 不能出现在 step 的 if 表达式里，先映射到 job 级 env 再判断
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform, build-tools and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Install Linux GUI dependencies (for wails3 CLI)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            patchelf

      - name: Install wails3 + task CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.4
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(git rev-parse --short=7 HEAD)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" build/android/app/build.gradle

      - name: Decode signing keystore (optional)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android-release.keystore
          echo "ANDROID_KEYSTORE_FILE=$PWD/android-release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build Android APK (arm64)
        run: task android:package

      - name: Rename artifact
        run: mv bin/spark.apk "Spark-${{ env.VERSION }}-android-arm64.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spark-${{ env.VERSION }}-android-arm64
          path: Spark-*-android-*.apk
          if-no-files-found: error

      - name: Publish to GitHub Release (tags only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Spark-*-android-*.apk
          name: Spark ${{ github.ref_name }}
          draft: false
          prerelease: false
